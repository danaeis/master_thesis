<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1092" viewBox="0 0 1000 1092" role="img" aria-labelledby="figtitle figdesc">
    <title id="figtitle">Multi-phase CT registration pipeline flow diagram</title>
    <desc id="figdesc">Nine sequential stages from DICOM ingestion through evaluation, with a two-branch ablation fork at the cropping stage, two acceptance gates in the rigid stack, and a mask-governance lane showing which organ mask defines the metric domain at each stage.</desc>

    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#3E525C"/>
      </marker>
      <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#9C3F2B"/>
      </marker>
      <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,1 L9,5 L0,9 z" fill="#2F6D4C"/>
      </marker>
      <style>
        .bx{fill:#FFFFFF;stroke:#C3CFD4;stroke-width:1.4}
        .bx-a{fill:#FFFFFF;stroke:#1F6E80;stroke-width:1.8}
        .bx-b{fill:#F3F6F7;stroke:#C3CFD4;stroke-width:1.4;stroke-dasharray:5 3}
        .bx-m{fill:#F3F6F7;stroke:#C3CFD4;stroke-width:1.2}
        .ti{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:16.5px;font-weight:700;fill:#14212A}
        .tim{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:14px;font-weight:600;fill:#14212A}
        .sb{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:12.5px;font-weight:400;fill:#3E525C}
        .sbs{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11.5px;font-weight:400;fill:#6B7F89}
        .no{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;fill:#6B7F89;text-anchor:end}
        .ix{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;fill:#B96C11}
        .lb{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;fill:#3E525C}
        .lbb{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;fill:#9C3F2B}
        .lbg{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;fill:#2F6D4C}
        .hd{font-family:"IBM Plex Sans Condensed",sans-serif;font-size:11px;font-weight:600;letter-spacing:.13em;fill:#6B7F89}
        .cn{stroke:#3E525C;stroke-width:1.4;fill:none}
        .dsh{stroke:#1F6E80;stroke-width:1.2;fill:none;stroke-dasharray:3 3;opacity:.85}
      </style>
    </defs>

    <!-- ══ lane headers ══ -->
    <text class="hd" x="60" y="18">DATA PATH</text>
    <text class="hd" x="720" y="18">METRIC DOMAIN</text>

    <!-- ══ 1 DICOM ══ -->
    <rect class="bx" x="60" y="30" width="570" height="62" rx="3"/>
    <text class="ix" x="78" y="52">01</text>
    <text class="ti" x="108" y="54">DICOM ingestion</text>
    <text class="sb" x="108" y="74">Thinnest-slice series selected per (study, phase)</text>
    <text class="no" x="612" y="52">265 studies</text>
    <text class="no" x="612" y="68">1188 series</text>
    <path class="cn" d="M345,92 V120" marker-end="url(#ah)"/>

    <!-- ══ 2 standardise ══ -->
    <rect class="bx" x="60" y="126" width="570" height="76" rx="3"/>
    <text class="ix" x="78" y="148">02</text>
    <text class="ti" x="108" y="150">Geometric + intensity standardisation</text>
    <text class="sb" x="108" y="170">LPS reorient · 1.5 mm isotropic · fill −1024 HU</text>
    <text class="sbs" x="108" y="188">HU clip [−1024, +3000] removes the −4048 scanner sentinel</text>
    <text class="no" x="612" y="148">772 volumes</text>
    <text class="no" x="612" y="164">100% ok</text>
    <path class="cn" d="M345,202 V230" marker-end="url(#ah)"/>

    <!-- ══ 3 segmentation ══ -->
    <rect class="bx" x="60" y="236" width="570" height="76" rx="3"/>
    <text class="ix" x="78" y="258">03</text>
    <text class="ti" x="108" y="260">TotalSegmentator + label merge</text>
    <text class="sb" x="108" y="280">91 structures → one multi-label volume, fixed integer map</text>
    <text class="sbs" x="108" y="298">Sanity gate: ≥2 of 4 anchor organs, ≥1 spine label</text>
    <text class="no" x="612" y="258">771 / 772 pass</text>
    <text class="no" x="612" y="274">8.0% median cover</text>
    <path class="cn" d="M345,312 V336"/>
    <path class="cn" d="M198,336 H492"/>
    <path class="cn" d="M198,336 V358" marker-end="url(#ah)"/>
    <path class="cn" d="M492,336 V358" marker-end="url(#ah)"/>

    <!-- ══ 4 fork ══ -->
    <rect class="bx-a" x="60" y="364" width="275" height="92" rx="3"/>
    <text class="ix" x="78" y="386">04a</text>
    <text class="tim" x="118" y="387">Crop + Z/XY align</text>
    <text class="sb" x="78" y="408">3D organ-centroid offset,</text>
    <text class="sb" x="78" y="425">confidence-gated (γ ≥ 0.40)</text>
    <text class="sbs" x="78" y="444">Z applied 12.4% · XY 8.8% of series</text>

    <rect class="bx-b" x="355" y="364" width="275" height="92" rx="3"/>
    <text class="ix" x="373" y="386">04b</text>
    <text class="tim" x="413" y="387">Crop only — control</text>
    <text class="sb" x="373" y="408">Identical physical-mm crop,</text>
    <text class="sb" x="373" y="425">no alignment applied</text>
    <text class="sbs" x="373" y="444">Isolates the contribution of 04a</text>

    <text class="no" x="612" y="474">169 studies · 453 moving series</text>

    <path class="cn" d="M198,456 V486"/>
    <path class="cn" d="M492,456 V486"/>
    <path class="cn" d="M198,486 H492"/>
    <path class="cn" d="M345,486 V510" marker-end="url(#ah)"/>

    <!-- ══ 5 pass 0 ══ -->
    <rect class="bx" x="60" y="516" width="570" height="70" rx="3"/>
    <text class="ix" x="78" y="538">05</text>
    <text class="ti" x="108" y="540">Rigid Pass 0 — Kabsch SVD</text>
    <text class="sb" x="108" y="560">Closed-form weighted rotation + translation from organ centroids</text>
    <text class="no" x="612" y="538">median 4.33 mm</text>
    <text class="no" x="612" y="554">max 195.5 mm</text>
    <path class="cn" d="M345,586 V614" marker-end="url(#ah)"/>

    <!-- ══ 6 pass 1 ══ -->
    <rect class="bx" x="60" y="620" width="570" height="78" rx="3"/>
    <text class="ix" x="78" y="642">06</text>
    <text class="ti" x="108" y="644">Rigid Pass 1 — Nelder–Mead</text>
    <text class="sb" x="108" y="664">Minimise λ·d_centroid + (1 − eroded Dice), λ = 10, derivative-free</text>
    <text class="sbs" x="108" y="682">Gate: revert to Pass 0 if error rises above max(1.10×, +3 mm)</text>
    <text class="no" x="612" y="642">median 2.09 mm</text>
    <text class="no" x="612" y="658">max 14.25 mm</text>

    <!-- main connector 6 → 7 -->
    <path class="cn" d="M345,698 V726" marker-end="url(#ah)"/>

    <!-- bypass: pass 1 → deformable -->
    <path d="M345,706 H648 Q664,706 664,722 V858 Q664,874 648,874 H370" fill="none" stroke="#9C3F2B" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ahb)"/>
    <text class="lbb" x="380" y="868">reverted to Pass 1 — 695 / 699 (99.4%)</text>

    <!-- ══ 7 pass 2 ══ -->
    <rect class="bx" x="60" y="732" width="570" height="78" rx="3"/>
    <text class="ix" x="78" y="754">07</text>
    <text class="ti" x="108" y="756">Rigid Pass 2 — gradient-magnitude NCC</text>
    <text class="sb" x="108" y="776">|∇HU| clamped to 200, ANTs NCC r=4, pyramid [4,2,1] / [2,1,0] mm</text>
    <text class="sbs" x="108" y="794">Gate: accept only if centroid error ≤ 1.05 × Pass 1</text>
    <text class="no" x="612" y="754">median 13.99 mm</text>
    <text class="no" x="612" y="770">accepted 4 / 699</text>

    <path d="M345,810 V884" fill="none" stroke="#2F6D4C" stroke-width="1.5" marker-end="url(#ahg)"/>
    <text class="lbg" x="200" y="838">accepted 0.6%</text>

    <!-- ══ 8 b-spline ══ -->
    <rect class="bx" x="60" y="890" width="570" height="72" rx="3"/>
    <text class="ix" x="78" y="912">08</text>
    <text class="ti" x="108" y="914">B-spline deformable refinement</text>
    <text class="sb" x="108" y="934">25 mm control grid · L-BFGS-B · pyramid [4,2,1] · 7 selectable metrics</text>
    <text class="sbs" x="108" y="952">Fitted on metric images, applied to original CT (Lanczos)</text>
    <text class="no" x="612" y="912">headline: grad-NCC</text>
    <path class="cn" d="M345,962 V990" marker-end="url(#ah)"/>

    <!-- ══ 9 evaluation ══ -->
    <rect class="bx" x="60" y="996" width="570" height="76" rx="3"/>
    <text class="ix" x="78" y="1018">09</text>
    <text class="ti" x="108" y="1020">Evaluation — held-out metric domain</text>
    <text class="sb" x="108" y="1040">Eroded Dice (6 mm) · HD95 · centroid mm · |∇HU|-NCC · MIND-NCC · %|J|≤0</text>
    <text class="sbs" x="108" y="1058">Computed on the full mask, never on the mask that was optimised</text>
    <text class="no" x="612" y="1018">11 organs</text>
    <text class="no" x="612" y="1034">55–63 pairs</text>

    <!-- ══════════ MASK LANE ══════════ -->
    <!-- vertical governance spine -->
    <path class="dsh" d="M700,404 V928"/>

    <!-- M_full -->
    <rect class="bx-m" x="720" y="236" width="270" height="76" rx="3"/>
    <text class="tim" x="736" y="260">M_full — tiers 1·2·3</text>
    <text class="sbs" x="736" y="279">All segmented organs. Defines the crop</text>
    <text class="sbs" x="736" y="295">bounding box and the evaluation domain.</text>
    <path class="dsh" d="M720,274 H690 V410 H636" marker-end="url(#ah)"/>
    <path class="dsh" d="M690,1034 H636" marker-end="url(#ah)"/>
    <path class="dsh" d="M690,274 V1034"/>

    <!-- M_reg -->
    <rect class="bx-m" x="720" y="364" width="270" height="92" rx="3"/>
    <text class="tim" x="736" y="388">M_reg — tiers 1 + 2</text>
    <text class="sbs" x="736" y="407">Bone + contrast-stable soft tissue.</text>
    <text class="sbs" x="736" y="423">Anchors 04a, drives Kabsch, masks the</text>
    <text class="sbs" x="736" y="439">Pass 2 and B-spline objectives.</text>
    <path class="dsh" d="M720,410 H700"/>
    <path class="dsh" d="M700,551 H636" marker-end="url(#ah)"/>
    <path class="dsh" d="M700,771 H636" marker-end="url(#ah)"/>
    <path class="dsh" d="M700,928 H636" marker-end="url(#ah)"/>

    <!-- D-set -->
    <rect class="bx-m" x="720" y="620" width="270" height="92" rx="3"/>
    <text class="tim" x="736" y="644">D — 11 curated labels</text>
    <text class="sbs" x="736" y="663">Liver, spleen, kidneys, L1–L5, cord,</text>
    <text class="sbs" x="736" y="679">aorta, IVC. Sole domain of the Pass 1</text>
    <text class="sbs" x="736" y="695">loss and of every acceptance gate.</text>
    <path class="dsh" d="M720,666 H700"/>
    <path class="dsh" d="M700,666 H636" marker-end="url(#ah)"/>

    <!-- excluded -->
    <rect x="720" y="732" width="270" height="78" rx="3" fill="none" stroke="#C3CFD4" stroke-width="1.2" stroke-dasharray="4 4"/>
    <text class="tim" x="736" y="756">Tier 0 — excluded entirely</text>
    <text class="sbs" x="736" y="775">Colon, small bowel, duodenum, rectum.</text>
    <text class="sbs" x="736" y="791">Peristalsis and gas make them a source</text>
    <text class="sbs" x="736" y="807">of conflicting gradient, not of signal.</text>
  </svg>